name: Call Build

on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: UTC

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  build:
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    strategy:
      matrix:
        config:
          [
            {
              workflow: "build-openwrt",
              openwrt_branch: "openwrt;main",
              device_branch: "mt7981",
            },
            {
              workflow: "build-openwrt",
              openwrt_branch: "immortalwrt;master",
              device_branch: "mt7981",
            },
            {
              workflow: "build-openwrt",
              openwrt_branch: "immortalwrt-mt798x;openwrt-21.02",
              device_branch: "mt7981",
            },
            {
              workflow: "build-u-boot",
              openwrt_branch: "u-boot",
              device_branch: "all",
            },
          ]
      fail-fast: false
    steps:
      - name: Trigger workflow
        id: build
        working-directory: /
        env:
          workflow: ${{ matrix.config.workflow }}
        run: |
          data='
          {
            "ref": "main",
            "inputs": {
              "openwrt_branch": "${{ matrix.config.openwrt_branch }}",
              "device_branch": "${{ matrix.config.device_branch }}"
            }
          }'
          curl -XPOST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: Bearer ${{ secrets.PAT }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ env.workflow }}.yml/dispatches \
          --data "$data"
